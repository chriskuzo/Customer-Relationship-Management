# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/mahwidb
spring.datasource.username=postgres
spring.datasource.password=newpassword


# ===============================
# JPA and Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Flyway (Database Migrations)
# ===============================
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
# If DB already has objects but no flyway_schema_history, create baseline to allow migrations
spring.flyway.baseline-on-migrate=true
# optional: avoid failing if validation mismatch
spring.flyway.validate-on-migrate=false

# ===============================
# Swagger UI
# ===============================
springdoc.swagger-ui.path=/swagger-ui/index.html

# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# JWT Configuration
# ===============================
# Generate a secure key of at least 256 bits (32 bytes)
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration-ms=86400000
